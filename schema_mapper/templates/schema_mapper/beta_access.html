<!DOCTYPE html>
<html>
<head>
  <title>Beta Access</title>
</head>
<body>
  <h2>Private Beta Access</h2>

  <form method="post" action="{% url 'submit_beta_code' %}">
    {% csrf_token %}
    <input
      type="text"
      name="beta_code"
      placeholder="Enter beta code"
      required
    />
    <button type="submit">Enter</button>
  </form>

  {% if error %}
    <p style="color:red">{{ error }}</p>
  {% endif %}
</body>
</html>
